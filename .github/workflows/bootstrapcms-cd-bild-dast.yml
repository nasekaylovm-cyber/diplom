name: CD BILD_DEP_DAST

on:
  push:
    branches: [ nasekaylovm-cyber-patch-5 ]
  pull_request:
    branches: [ nasekaylovm-cyber-patch-5 ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Configure Composer Plugins
      run: |
        composer config --no-plugins allow-plugins.kylekatarnls/update-helper true

    - name: Build Docker image
      run: |
        docker build \
          --build-arg COMPOSER_ALLOW_PLUGINS="true" \
          -t bootstrap-cms:latest .

    - name: Run security scan
      run: |
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
        trivy image --exit-code 0 --severity HIGH,CRITICAL bootstrap-cms:latest

    - name: Prepare database container
      run: |
        docker run --name test-db -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=test -d mysql:5.7
        sleep 20

    - name: Run application tests
      run: |
        docker run --link test-db:mysql --name test-cms -d bootstrap-cms:latest
        sleep 30
        
        
        docker exec test-cms sh -c "echo 'DB_CONNECTION=mysql' >>.env"
        docker exec test-cms sh -c "echo 'DB_HOST=mysql' >>.env"
        docker exec test-cms sh -c "echo 'DB_PORT=3306' >>.env"
        docker exec test-cms sh -c "echo 'DB_DATABASE=test' >>.env"
        docker exec test-cms sh -c "echo 'DB_USERNAME=root' >>.env"
        docker exec test-cms sh -c "echo 'DB_PASSWORD=root' >>.env"
        
      
        docker exec test-cms php artisan app:install
        docker exec test-cms gulp --production
        
       
        curl -f http://localhost:80 || exit 1

    - name: Generate Security Report
      run: |
        trivy image --format spdx --output security-report.spdx bootstrap-cms:latest
        trivy image --format sarif --output security-report.sarif bootstrap-cms:latest

    - name: Generate Code Quality Report
      run: |
        docker exec test-cms composer require phpstan/phpstan
        docker exec test-cms vendor/bin/phpstan analyse --format=json > code-quality.json

    - name: Generate Test Coverage Report
      run: |
        docker exec test-cms composer require phpunit/phpunit
        docker exec test-cms vendor/bin/phpunit --coverage-clover coverage.xml

    - name: Upload Security Report
      uses: github/codeql-action/upload-sarif@v3
      
      with:
        sarif_file: security-report.sarif

    - name: Upload Code Quality Report
      uses: actions/upload-artifact@v3
      with:
        name: code-quality-report
        path: code-quality.json

    - name: Upload Coverage Report
      uses: codecov/codecov-action@v3
      with:
        files: coverage.xml
        flags: unittests
        name: codecov-upload

    - name: Cleanup
      run: |
        docker stop test-cms
        docker rm test-cms
        docker stop test-db
        docker rm test-db

    - name: Mail configuration for tests
      run: |
        docker exec test-cms sh -c "echo 'MAIL_DRIVER=log' >>.env"
        docker exec test-cms sh -c "echo 'MAIL_HOST=mailtrap.io' >>.env"

    - name: Contact configuration
      run: |
        docker exec test-cms sh -c "echo
