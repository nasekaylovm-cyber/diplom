name: "CodeQL"

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  codeql:
    runs-on: ubuntu-latest
    steps:
      
    - uses: actions/checkout@v4
    - name: Init CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: javascript
    - name: Autobuild
      uses: github/codeql-action/autobuild@v3
    - name: Analyze
      uses: github/codeql-action/analyze@v3
      
  php-static:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 7.4
        tools: composer:v2
        coverage: none

    - name: Clear Composer Cache
      run: composer clear-cache

    - name: Remove problematic files
      run: |
        rm -rf vendor
        rm -f composer.lock

    - name: Install dependencies
      run: |
        composer install \
        --no-interaction \
        --no-progress

    - name: Dump autoload
      run: composer dump-autoload

    - name: Verify autoload file exists
      run: |
        if [ ! -f vendor/autoload.php ]; then
          echo "Autoload file not found!"
          exit 1
        fi

    - name: Clear Laravel cache
      run: php artisan clear-compiled

    - name: Run Psalm
      run: ./vendor/bin/psalm --show-info=false --output-format=github

    - name: Upload Psalm report (optional)
      uses: actions/upload-artifact@v4
      with:
        name: psalm-report
        path: psalm.xml

    - name: Clear Laravel cache
      run: php artisan clear-compiled

    - name: Run Psalm
      run: ./vendor/bin/psalm --show-info=false --output-format=github

    - name: Upload Psalm report (optional)
      uses: actions/upload-artifact@v4
      with:
        name: psalm-report
        path: psalm.xml
